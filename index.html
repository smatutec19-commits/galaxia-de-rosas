<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Galaxia de Rosas - Para mi Socio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020108;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .header-title {
      text-align: center;
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 50, 80, 0.8), 0 0 30px rgba(255, 215, 0, 0.6);
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 10px;
      pointer-events: auto;
    }
    .controls-hint {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.9rem;
      margin-bottom: 15px;
      text-shadow: 0 0 5px rgba(0,0,0,0.8);
    }
    .audio-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      pointer-events: auto;
      background: rgba(20, 10, 30, 0.7);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #ffd700;
      padding: 10px 16px;
      border-radius: 30px;
      cursor: pointer;
      backdrop-filter: blur(5px);
      font-size: 0.9rem;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    }
    .audio-btn:hover {
      background: rgba(255, 215, 0, 0.2);
      transform: scale(1.05);
    }
    #modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: rgba(15, 5, 25, 0.9);
      border: 2px solid #ffd700;
      border-radius: 20px;
      padding: 25px 35px;
      color: #fff;
      text-align: center;
      z-index: 100;
      pointer-events: auto;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 30px rgba(255, 50, 80, 0.5), inset 0 0 15px rgba(255, 215, 0, 0.3);
      max-width: 85%;
      width: 380px;
    }
    #modal.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }
    #modal h3 {
      color: #ffd700;
      margin-bottom: 12px;
      font-size: 1.4rem;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
    }
    #modal p {
      font-size: 1.1rem;
      line-height: 1.5;
      color: #f0f0f0;
    }
    #modal .close-btn {
      margin-top: 20px;
      background: linear-gradient(45deg, #ff3366, #ff0040);
      border: none;
      color: white;
      padding: 8px 20px;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="webgl-container"></div>

  <div id="ui-overlay">
    <div class="header-title">GALAXIA DE ROSAS</div>
    <button class="audio-btn" id="audioToggle">🎵 Música: OFF</button>
    <div class="controls-hint">Toca o haz clic en las rosas y mensajes | Arrastra para girar 360°</div>
  </div>

  <div id="modal">
    <h3 id="modal-title">Mensaje</h3>
    <p id="modal-text">Un mensaje especial para mi socio.</p>
    <button class="close-btn" onclick="closeModal()">Cerrar</button>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let petalsMesh, starsMesh;
    const interactiveObjects = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    // Mensajes para el socio
    const messages = [
      "¡Te quiero socio! Gracias por estar firme siempre.",
      "Contigo el día pesa menos.",
      "Tu amistad, mi lugar favorito.",
      "Lealtad y hermandad para siempre.",
      "Aquí siempre, en las buenas y en las malas.",
      "Gracias por ser mi sol de siempre.",
      "Que esta rosa te recuerde cuánto vales.",
      "Hermanos de vida, socios de camino."
    ];

    const phrases = [
      "TE QUIERO SOCIO",
      "CONTIGO EL DÍA PESA MENOS",
      "TU AMISTAD MI LUGAR FAVORITO",
      "AQUÍ SIEMPRE",
      "LEALTAD ETERNA",
      "GRACIAS POR ESTAR AHÍ",
      "HERMANOS DE VIDA"
    ];

    function init() {
      const container = document.getElementById('webgl-container');

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020108, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 15, 35);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 70;
      controls.minDistance = 10;

      // Luces
      const ambientLight = new THREE.AmbientLight(0xffcccc, 0.8);
      scene.add(ambientLight);

      const centerLight = new THREE.PointLight(0xff5577, 3, 50);
      centerLight.position.set(0, 0, 0);
      scene.add(centerLight);

      const goldLight = new THREE.PointLight(0xffd700, 2, 40);
      goldLight.position.set(0, 2, 0);
      scene.add(goldLight);

      // Crear elementos de la escena
      createCentralRose();
      createStarfield();
      createFloatingPetals();
      createOrbitingRosesAndBundles();
      createOrbitingTextRings();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onClick);
      window.addEventListener('touchstart', onTouchStart, { passive: false });

      animate();
    }

    // Rosa Sol Central
    function createCentralRose() {
      const group = new THREE.Group();

      // Núcleo resplandeciente
      const coreGeo = new THREE.SphereGeometry(2.5, 32, 32);
      const coreMat = new THREE.MeshBasicMaterial({
        color: 0xff1144,
        wireframe: false
      });
      const core = new THREE.Mesh(coreGeo, coreMat);
      group.add(core);

      // Capas de pétalos
      for (let i = 0; i < 30; i++) {
        const petalGeo = new THREE.ConeGeometry(0.8, 2.5, 5);
        const petalMat = new THREE.MeshStandardMaterial({
          color: i % 2 === 0 ? 0xff0033 : 0xe60039,
          roughness: 0.3,
          metalness: 0.1,
          emissive: 0x440011
        });
        const petal = new THREE.Mesh(petalGeo, petalMat);
        
        const phi = Math.acos(-1 + (2 * i) / 30);
        const theta = Math.sqrt(30 * Math.PI) * phi;
        
        petal.position.setFromSphericalCoords(2.2, phi, theta);
        petal.lookAt(0, 0, 0);
        petal.rotation.z += Math.PI;
        group.add(petal);
      }

      // Disco / Aura de Sol
      const auraGeo = new THREE.RingGeometry(3, 7, 64);
      const auraMat = new THREE.MeshBasicMaterial({
        color: 0xffaa00,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.4
      });
      const aura = new THREE.Mesh(auraGeo, auraMat);
      aura.rotation.x = Math.PI / 2;
      group.add(aura);

      group.userData = { msg: "¡Eres el centro de este universo, socio!" };
      interactiveObjects.push(core);
      scene.add(group);
    }

    // Crear textura de Rosa/Ramo
    function createFlowerTexture(isBundle = false) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'transparent';
      ctx.fillRect(0, 0, 256, 256);

      if (isBundle) {
        // Ramo de rosas
        for (let i = 0; i < 7; i++) {
          const cx = 128 + Math.cos(i * 0.9) * 45;
          const cy = 128 + Math.sin(i * 0.9) * 45;
          drawRoseCanvas(ctx, cx, cy, 35);
        }
      } else {
        // Rosa única
        drawRoseCanvas(ctx, 128, 128, 90);
      }

      return new THREE.CanvasTexture(canvas);
    }

    function drawRoseCanvas(ctx, cx, cy, r) {
      const grad = ctx.createRadialGradient(cx, cy, 5, cx, cy, r);
      grad.addColorStop(0, '#ff6688');
      grad.addColorStop(0.4, '#cc0033');
      grad.addColorStop(1, '#66001a');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Detalles de pétalos
      ctx.strokeStyle = '#ff99bb';
      ctx.lineWidth = 3;
      for (let j = 0; j < 5; j++) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * (0.3 + j * 0.12), j, j + 3.5);
        ctx.stroke();
      }
    }

    // Rosas y Ramos Orbitando
    function createOrbitingRosesAndBundles() {
      const singleRoseTex = createFlowerTexture(false);
      const bundleTex = createFlowerTexture(true);

      const roseMat = new THREE.SpriteMaterial({ map: singleRoseTex, transparent: true });
      const bundleMat = new THREE.SpriteMaterial({ map: bundleTex, transparent: true });

      const count = 40;
      for (let i = 0; i < count; i++) {
        const isBundle = i % 4 === 0;
        const sprite = new THREE.Sprite(isBundle ? bundleMat : roseMat);
        
        const radius = 10 + Math.random() * 25;
        const angle = Math.random() * Math.PI * 2;
        const height = (Math.random() - 0.5) * 8;

        sprite.position.set(
          Math.cos(angle) * radius,
          height,
          Math.sin(angle) * radius
        );

        const scale = isBundle ? 3.5 : 2.0;
        sprite.scale.set(scale, scale, 1);

        sprite.userData = {
          radius: radius,
          angle: angle,
          speed: (0.002 + Math.random() * 0.003) * (Math.random() > 0.5 ? 1 : -1),
          height: height,
          msg: messages[Math.floor(Math.random() * messages.length)]
        };

        scene.add(sprite);
        interactiveObjects.push(sprite);
      }
    }

    // Textos orbitando en canvas 3D
    function createOrbitingTextRings() {
      phrases.forEach((text, idx) => {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        ctx.font = 'Bold 28px sans-serif';
        ctx.fillStyle = '#ffd700';
        ctx.textAlign = 'center';
        ctx.shadowColor = '#ff0055';
        ctx.shadowBlur = 10;
        ctx.fillText(text, 256, 42);

        const texture = new THREE.CanvasTexture(canvas);
        const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(mat);

        const radius = 12 + idx * 3.5;
        const angle = (idx / phrases.length) * Math.PI * 2;

        sprite.position.set(Math.cos(angle) * radius, (idx - 3) * 1.2, Math.sin(angle) * radius);
        sprite.scale.set(8, 1, 1);

        sprite.userData = {
          radius: radius,
          angle: angle,
          speed: 0.0015 + idx * 0.0003,
          height: (idx - 3) * 1.2,
          msg: `"${text}" - Dedicado a mi socio.`
        };

        scene.add(sprite);
        interactiveObjects.push(sprite);
      });
    }

    // Pétalos flotantes
    function createFloatingPetals() {
      const petalCount = 600;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(petalCount * 3);
      const scales = new Float32Array(petalCount);

      for (let i = 0; i < petalCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 60;
        positions[i + 1] = (Math.random() - 0.5) * 40;
        positions[i + 2] = (Math.random() - 0.5) * 60;
        scales[i / 3] = Math.random() * 0.5 + 0.2;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

      // Textura suave para pétalo
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ff1a40';
      ctx.beginPath();
      ctx.arc(16, 16, 14, 0, Math.PI * 2);
      ctx.fill();

      const texture = new THREE.CanvasTexture(canvas);
      const mat = new THREE.PointsMaterial({
        size: 0.8,
        map: texture,
        transparent: true,
        opacity: 0.8,
        depthWrite: false
      });

      petalsMesh = new THREE.Points(geo, mat);
      scene.add(petalsMesh);
    }

    // Fondo Estelar
    function createStarfield() {
      const starCount = 1200;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(starCount * 3);

      for (let i = 0; i < starCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 150;
        positions[i + 1] = (Math.random() - 0.5) * 150;
        positions[i + 2] = (Math.random() - 0.5) * 150;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.4, transparent: true, opacity: 0.6 });
      starsMesh = new THREE.Points(geo, mat);
      scene.add(starsMesh);
    }

    // Animación continua
    function animate() {
      requestAnimationFrame(animate);

      // Rotar objetos en órbita
      interactiveObjects.forEach(obj => {
        if (obj.userData && obj.userData.radius) {
          obj.userData.angle += obj.userData.speed;
          obj.position.x = Math.cos(obj.userData.angle) * obj.userData.radius;
          obj.position.z = Math.sin(obj.userData.angle) * obj.userData.radius;
        }
      });

      // Movimiento de pétalos
      if (petalsMesh) {
        const pos = petalsMesh.geometry.attributes.position.array;
        for (let i = 1; i < pos.length; i += 3) {
          pos[i] -= 0.03;
          if (pos[i] < -20) pos[i] = 20;
        }
        petalsMesh.geometry.attributes.position.needsUpdate = true;
        petalsMesh.rotation.y += 0.0005;
      }

      if (starsMesh) {
        starsMesh.rotation.y += 0.0001;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Interacción Raycast
    function checkIntersection(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        const hitObj = intersects[0].object;
        const msg = hitObj.userData.msg || hitObj.parent?.userData?.msg;
        if (msg) {
          showModal("Para mi Socio 🌹", msg);
        }
      }
    }

    function onClick(e) {
      checkIntersection(e.clientX, e.clientY);
    }

    function onTouchStart(e) {
      if (e.touches.length === 1) {
        checkIntersection(e.touches[0].clientX, e.touches[0].clientY);
      }
    }

    function showModal(title, text) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-text').innerText = text;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Audio Sintetizado
    let audioCtx, oscillator, isAudioPlaying = false;
    document.getElementById('audioToggle').addEventListener('click', () => {
      if (!isAudioPlaying) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        playAmbientTune();
        document.getElementById('audioToggle').innerText = "🎵 Música: ON";
        isAudioPlaying = true;
      } else {
        if (audioCtx) audioCtx.close();
        document.getElementById('audioToggle').innerText = "🎵 Música: OFF";
        isAudioPlaying = false;
      }
    });

    function playAmbientTune() {
      const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
      let step = 0;
      setInterval(() => {
        if (!isAudioPlaying || !audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 1.8);
        step++;
      }, 800);
    }

    window.onload = init;
  </script>
</body>
</html>
